<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>WAFAR - Login</title>

  <!-- Main Styles -->
  <link rel="stylesheet" href="../../css/main.css">

  <!-- Components -->
  <link rel="stylesheet" href="../../css/components.css">

  <!-- Responsive -->
  <link rel="stylesheet" href="../../css/responsive.css">


  <link rel="stylesheet" href="login.css">

</head>


<body>


  <!-- =======================================================
       LOGIN PAGE
       ======================================================= -->

  <div class="login-wrapper">


    <!-- =====================================================
         LEFT — LOGIN
         ===================================================== -->

    <section class="login-left-panel">


      <!-- Top Controls -->

      <div class="login-top-controls">

        <button
          type="button"
          class="header-toggle-btn"
          id="langSwitchBtn"
          onclick="i18n.toggleLanguage()"
        >
          عربي
        </button>


        <button
          type="button"
          class="header-toggle-btn theme-toggle-btn"
          aria-label="Toggle theme"
        >
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
        </button>

      </div>



      <!-- Login Card -->

      <div class="login-card">


        <!-- Brand -->

        <div class="login-brand-header">

          <img
            src="../../assets/images/WAFAR-LOGO .png"
            alt="WAFAR Logo"
            class="login-logo"
          >


          <h1
            class="login-title"
            data-i18n="login_welcome"
          >
            Welcome to WAFAR
          </h1>


          <p
            class="login-subtitle"
            data-i18n="login_subtitle"
          >
            Smart energy monitoring and bill savings for your home
          </p>

        </div>



        <!-- Sign In Tab -->

        <div class="auth-tab-switch">

          <button
            type="button"
            class="auth-tab-btn active"
            id="tabLogin"
            data-i18n="login_tab_signin"
          >
            Sign In
          </button>

        </div>



        <!-- Login Form -->

        <form
          id="loginForm"
          onsubmit="handleLoginSubmit(event)"
        >


          <!-- Email -->

          <div class="form-group">

            <label
              class="form-label"
              for="emailInput"
              data-i18n="login_email"
            >
              Email Address
            </label>


            <div class="input-icon-wrapper">


              <svg
                class="input-icon"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >

                <path
                  d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"
                />

                <polyline
                  points="22,6 12,13 2,6"
                />

              </svg>


              <input
                type="email"
                id="emailInput"
                class="form-control"
                placeholder="h00001@energy.local"
                value="h00001@energy.local"
                required
              >

            </div>

          </div>



          <!-- Password -->

          <div class="form-group">


            <div
              style="
                display:flex;
                justify-content:space-between;
                align-items:center;
                margin-bottom:8px;
              "
            >

              <label
                class="form-label"
                for="passwordInput"
                style="margin-bottom:0;"
                data-i18n="login_password"
              >
                Password
              </label>


              <a
                href="#"
                class="forgot-link"
                onclick="handleForgotPassword(event)"
                data-i18n="login_forgot"
              >
                Forgot Password?
              </a>

            </div>



            <div class="input-icon-wrapper">


              <!-- Lock Icon -->

              <svg
                class="input-icon"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >

                <rect
                  x="3"
                  y="11"
                  width="18"
                  height="11"
                  rx="2"
                  ry="2"
                />

                <path
                  d="M7 11V7a5 5 0 0 1 10 0v4"
                />

              </svg>



              <input
                type="password"
                id="passwordInput"
                class="form-control"
                placeholder="••••••••••••"
                value=""
                required
              >



              <!-- Eye -->

              <span
                class="input-icon-right"
                onclick="togglePasswordVisibility()"
                title="Toggle visibility"
              >

                <svg
                  width="18"
                  height="18"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >

                  <path
                    d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"
                  />

                  <circle
                    cx="12"
                    cy="12"
                    r="3"
                  />

                </svg>

              </span>

            </div>

          </div>



          <!-- Remember -->

          <div class="remember-row">

            <label class="remember-label">

              <input
                type="checkbox"
                checked
              >

              <span data-i18n="login_remember">
                Remember this device
              </span>

            </label>

          </div>



          <!-- Submit -->

          <button
            type="submit"
            id="submitBtn"
          >

            <span data-i18n="login_btn">
              Sign In to Dashboard
            </span>


            <svg
              width="17"
              height="17"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >

              <line
                x1="5"
                y1="12"
                x2="19"
                y2="12"
              />

              <polyline
                points="12 5 19 12 12 19"
              />

            </svg>

          </button>


        </form>



        <!-- Footer -->

        <div
          class="login-footer"
          data-i18n="login_footer"
        >
          Protected by WAFAR Intelligent Eco Shield
        </div>


      </div>

    </section>



    <!-- =====================================================
         RIGHT — HOUSE IMAGE
         ===================================================== -->

    <section class="login-right-panel">

      <div class="image-depth"></div>

    </section>


  </div>



  <!-- Toast -->

  <div class="toast-container"></div>



  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../../js/config.js"></script>
  <script src="../../js/i18n.js"></script>
  <script src="../../js/api.js"></script>
  <script src="../../js/main.js"></script>

  <!-- Login Controller -->
  <script src="login.js"></script>


</body>

</html>
